name = "telegram-service-bot"
main = "src/index.js"
compatibility_date = "2026-11-10"

[[d1_databases]]
binding = "DB"
database_name = "telegram-service-bot-db"
database_id = "e3f5f605-9a2c-4969-8f08-a39f8110457f"
migrations_dir = "migrations"

# One tiny "alarm clock" per chat. It sends the rotating preset messages
# exactly every 13-15 seconds (cron triggers can't run that often).
[[durable_objects.bindings]]
name = "ROTATION"
class_name = "PresetRotation"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresetRotation"]

# Runs once a minute: continues large broadcasts and cleans old records.
[triggers]
crons = ["* * * * *"]

# Secrets (set these in the Cloudflare dashboard, NOT in this file):
#   TELEGRAM_BOT_TOKEN       - from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  - any long random text you invent (letters/numbers/_/-)
#   OWNER_ID                 - your numeric Telegram ID (the first admin)
# Optional:
#   FETCH_BUDGET             - Telegram calls per minute for broadcasts (default 40;
#                              raise it on the Workers Paid plan)
